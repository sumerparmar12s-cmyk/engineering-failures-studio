<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#0a0014;font-family:Anton,sans-serif}
.main{position:absolute;left:470px;top:0;width:960px;height:720px;background:url(main.png) 0 0/960px 720px no-repeat}
.sky{position:absolute;left:470px;top:0;width:760px;height:720px;background:linear-gradient(180deg,rgba(0,90,255,.35) 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 75%,rgba(0,40,120,.45) 100%);mix-blend-mode:multiply}
.fadeL{position:absolute;inset:0;background:linear-gradient(90deg,#0a0014 0%,#0a0014 40%,rgba(10,0,20,.7) 42%,rgba(10,0,20,0) 52%)}
.burst{position:absolute;left:-260px;top:-180px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(255,30,90,.5) 0%,rgba(255,30,90,0) 60%)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 30px rgba(0,0,0,.8)}
.t{position:absolute;left:36px;line-height:.92;text-transform:uppercase;transform:rotate(-3deg);paint-order:stroke fill}
.t1{top:62px;font-size:116px;color:#fff;-webkit-text-stroke:6px #000;text-shadow:0 8px 0 #000}
.t2{top:182px;font-size:156px;color:#FFE600;-webkit-text-stroke:7px #000;text-shadow:0 10px 0 #000,0 0 50px rgba(255,200,0,.55)}
.t3{top:350px;font-size:170px;color:#ff2d55;-webkit-text-stroke:7px #000;text-shadow:0 10px 0 #000,0 0 50px rgba(255,45,85,.7)}
.badge{position:absolute;left:44px;top:572px;background:#ff2d2d;color:#fff;font-size:54px;padding:6px 22px 2px;border:5px solid #000;box-shadow:8px 8px 0 #000;transform:rotate(-3deg)}
.badge2{position:absolute;left:236px;top:586px;background:#FFE600;color:#000;font-family:'Bebas Neue';font-size:50px;padding:6px 18px 0;border:5px solid #000;box-shadow:8px 8px 0 #000;transform:rotate(2deg)}
.inset{position:absolute;right:28px;top:26px;width:290px;height:218px;overflow:hidden;border:8px solid #FFE600;box-shadow:0 0 0 6px #000,0 0 40px rgba(255,230,0,.55);transform:rotate(4deg);background:url(fall.png) center/cover}
.insetlbl{position:absolute;right:40px;top:248px;font-size:38px;color:#fff;background:#000;padding:4px 14px 0;transform:rotate(4deg);border:4px solid #ff2d2d}
svg{position:absolute;inset:0}
.hand{font-family:'Permanent Marker';fill:#fff;stroke:#000;stroke-width:7px;paint-order:stroke;font-size:46px}
</style></head><body>
<div class="main"></div><div class="sky"></div><div class="fadeL"></div><div class="burst"></div><div class="vig"></div>
<svg width="1280" height="720" viewBox="0 0 1280 720">
  <ellipse cx="900" cy="460" rx="205" ry="95" fill="none" stroke="#000" stroke-width="18" transform="rotate(-22 900 460)"/>
  <ellipse cx="900" cy="460" rx="205" ry="95" fill="none" stroke="#ff2d2d" stroke-width="10" transform="rotate(-22 900 460)"/>
  <text x="640" y="680" class="hand" transform="rotate(-3 640 680)">ONLY 4 MONTHS OLD!</text>
</svg>
<div class="t t1">This bridge</div>
<div class="t t2">TORE ITSELF</div>
<div class="t t3">APART!</div>
<div class="badge">1940</div>
<div class="badge2">REAL FOOTAGE</div>
<div class="inset"></div>
<div class="insetlbl">MINUTES LATER</div>
</body></html>
