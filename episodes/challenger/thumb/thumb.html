<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#06101f;font-family:Anton,sans-serif}
.main{position:absolute;left:330px;top:-40px;width:1050px;height:812px;background:url(main.jpg) 50% 40%/cover no-repeat}
.fadeL{position:absolute;inset:0;background:linear-gradient(90deg,#06101f 0%,#06101f 26%,rgba(6,16,31,.75) 36%,rgba(6,16,31,0) 50%)}
.burst{position:absolute;left:-260px;top:-160px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(255,60,40,.45) 0%,rgba(255,60,40,0) 60%)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 150px 25px rgba(0,0,0,.75)}
.t{position:absolute;left:36px;line-height:.92;text-transform:uppercase;transform:rotate(-3deg);paint-order:stroke fill}
.t1{top:70px;font-size:132px;color:#fff;-webkit-text-stroke:6px #000;text-shadow:0 8px 0 #000}
.t2{top:200px;font-size:172px;color:#FFE600;-webkit-text-stroke:7px #000;text-shadow:0 10px 0 #000,0 0 50px rgba(255,200,0,.55)}
.t3{top:380px;font-size:96px;color:#ff3b3b;-webkit-text-stroke:6px #000;text-shadow:0 8px 0 #000,0 0 40px rgba(255,50,50,.7)}
.badge{position:absolute;left:44px;top:560px;background:#ff2d2d;color:#fff;font-size:54px;padding:6px 22px 2px;border:5px solid #000;box-shadow:8px 8px 0 #000;transform:rotate(-3deg)}
.badge2{position:absolute;left:236px;top:574px;background:#FFE600;color:#000;font-family:'Bebas Neue';font-size:50px;padding:6px 18px 0;border:5px solid #000;box-shadow:8px 8px 0 #000;transform:rotate(2deg)}
.inset{position:absolute;right:30px;bottom:34px;width:300px;height:225px;border:8px solid #00d4ff;box-shadow:0 0 0 6px #000,0 0 40px rgba(0,212,255,.6);transform:rotate(4deg);background:url(ice.jpg) center/cover}
.insetlbl{position:absolute;right:52px;bottom:262px;font-size:44px;color:#fff;background:#000;padding:4px 16px 0;transform:rotate(4deg);border:4px solid #00d4ff}
svg{position:absolute;inset:0}
.hand{font-family:'Permanent Marker';fill:#fff;stroke:#000;stroke-width:7px;paint-order:stroke;font-size:44px}
</style></head><body>
<div class="main"></div><div class="fadeL"></div><div class="burst"></div><div class="vig"></div>
<div class="t t1">They were</div><div class="t t2">WARNED.</div><div class="t t3">73 seconds later…</div>
<div class="badge">1986</div><div class="badge2">REAL NASA FOOTAGE</div>
<div class="insetlbl">36°F · ICE ON THE PAD</div><div class="inset"></div>
</body></html>
