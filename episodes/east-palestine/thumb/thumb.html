<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0907}
.bg{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000 56%);background:url(fire_crop.jpg) right center/auto 100% no-repeat;filter:saturate(1.15) contrast(1.08)}
.blur{position:absolute;left:0;top:0;width:640px;height:720px;background:url(fire_crop.jpg) 30% center/auto 140%;filter:blur(18px) brightness(.35)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0b0907 0%,rgba(11,9,7,.96) 33%,rgba(11,9,7,.55) 48%,rgba(11,9,7,0) 62%)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(0,0,0,.85)}
.top{position:absolute;left:34px;top:46px;font:900 50px 'Playfair Display',serif;color:#d8a25e;letter-spacing:.02em;text-shadow:0 3px 10px #000}
.big{position:absolute;left:28px;top:100px;font:900 122px/1.0 'Playfair Display',serif;color:#e3251b;-webkit-text-stroke:3px #fff;text-shadow:0 6px 0 #5a0a05,0 10px 30px #000;letter-spacing:-.01em}
.rib{position:absolute;left:0;top:398px;background:#c8150c;color:#fff;font:700 34px 'Oswald',sans-serif;padding:10px 34px 10px 36px;letter-spacing:.06em;box-shadow:0 6px 18px rgba(0,0,0,.7);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%)}
.card{position:absolute;left:30px;top:500px;width:600px;background:#fbfaf6;padding:12px 14px 10px;transform:rotate(-2.5deg);box-shadow:0 14px 34px rgba(0,0,0,.8)}
.card img{width:100%;display:block}
.card .lab{font:700 20px 'Oswald',sans-serif;color:#1a1a1a;letter-spacing:.08em;margin-top:6px}
.ring{position:absolute;left:8px;top:484px;width:650px;height:120px;border:6px solid #ff2a1a;border-radius:50%;transform:rotate(-3deg);box-shadow:0 0 12px rgba(255,40,20,.6)}
</style></head><body>
<div class="blur"></div><div class="bg"></div><div class="fade"></div><div class="vig"></div>
<div class="top">— THEY BURNED IT —</div>
<div class="big">FOR<br>NOTHING?</div>
<div class="rib">EAST PALESTINE, OHIO · 2023</div>
<div class="card"><img src="inset_doc.png"><div class="lab">NTSB FINAL REPORT · 2024</div></div>
<div class="ring"></div>
</body></html>
