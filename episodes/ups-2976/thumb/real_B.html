<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:Anton,sans-serif}
.p{position:absolute;inset:0;background:url(real_md11.jpg) center/cover;filter:contrast(1.12) saturate(1.1) brightness(.92)}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,120,50,.85) 0%,rgba(255,140,70,.45) 22%,rgba(255,160,90,0) 40%);mix-blend-mode:multiply}

.fire{position:absolute;left:455px;top:238px;width:300px;height:190px;background:url(flame_clean.jpg) 30% 30%/150% auto;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);filter:brightness(1.15) saturate(1.3) contrast(1.2)}
.trail{position:absolute;left:170px;top:285px;width:430px;height:150px;background:url(flame_clean.jpg) center/120% 160%;mix-blend-mode:screen;opacity:.9;transform:scaleX(-1);-webkit-mask-image:radial-gradient(ellipse 55% 45% at 45% 50%,#000 30%,transparent 75%);filter:brightness(1.2)}
.glow{position:absolute;left:370px;top:185px;width:460px;height:300px;background:radial-gradient(closest-side,rgba(255,140,40,.5),rgba(255,90,20,0) 100%);mix-blend-mode:screen}
.smoke{position:absolute;left:-40px;top:150px;width:720px;height:300px;background:radial-gradient(closest-side,rgba(28,24,22,.8),rgba(28,24,22,.45) 50%,rgba(28,24,22,0) 100%);filter:blur(8px);transform:rotate(-7deg)}
.smoke2{position:absolute;left:200px;top:190px;width:420px;height:200px;background:radial-gradient(closest-side,rgba(20,18,16,.75),rgba(20,18,16,0) 100%);filter:blur(6px)}

.dark{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.7) 100%)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 170px 40px rgba(0,0,0,.8)}
.t{position:absolute;text-transform:uppercase;paint-order:stroke fill;line-height:.9}
.t1{left:40px;top:24px;font-size:112px;color:#fff;-webkit-text-stroke:7px #000;text-shadow:0 8px 0 #000}
.t2{left:40px;top:126px;font-size:146px;color:#FFE600;-webkit-text-stroke:8px #000;text-shadow:0 10px 0 #000,0 0 40px rgba(255,200,0,.45)}
.inset{position:absolute;right:30px;bottom:34px;width:330px;height:210px;background:url(race.jpg) center/cover;border:7px solid #fff;box-shadow:0 0 0 5px #000,0 10px 30px rgba(0,0,0,.7);transform:rotate(3deg)}
.il{position:absolute;right:46px;bottom:250px;font-size:44px;color:#fff;background:#e0111d;padding:4px 16px 0;border:4px solid #000;transform:rotate(3deg)}
.badge{position:absolute;left:40px;bottom:36px;background:#e0111d;color:#fff;font-size:44px;padding:6px 18px 2px;border:5px solid #000;box-shadow:7px 7px 0 #000;transform:rotate(-2deg)}
svg{position:absolute;inset:0}</style></head><body>
<div class="p"></div><div class="sky"></div><div class="smoke"></div><div class="smoke2"></div><div class="glow"></div><div class="trail"></div><div class="fire"></div><div class="dark"></div><div class="vig"></div>
<svg width="1280" height="720"><ellipse cx="598" cy="330" rx="125" ry="82" fill="none" stroke="#000" stroke-width="18" transform="rotate(-6 598 330)"/><ellipse cx="598" cy="330" rx="125" ry="82" fill="none" stroke="#e0111d" stroke-width="10" transform="rotate(-6 598 330)"/>
<path d="M 850 245 Q 790 245 735 290" fill="none" stroke="#000" stroke-width="20" stroke-linecap="round"/><path d="M 850 245 Q 790 245 735 290" fill="none" stroke="#e0111d" stroke-width="11" stroke-linecap="round"/>
<path d="M 742 250 L 728 296 L 776 298" fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M 742 250 L 728 296 L 776 298" fill="none" stroke="#e0111d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="t t1">The engine</div><div class="t t2">fell off</div>
<div class="il">THIS CRACKED</div><div class="inset"></div><div class="badge">19 SECONDS</div></body></html>
