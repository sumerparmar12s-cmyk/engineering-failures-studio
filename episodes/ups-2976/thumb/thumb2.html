<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Abril+Fatface&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#000}
.img{position:absolute;inset:0;background:url(IMG) center/cover}
.parch{position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,rgba(250,240,215,.97) 0%,rgba(250,236,205,.9) 42%,rgba(250,230,200,.55) 70%,rgba(250,230,200,0) 100%)}
.edge{position:absolute;inset:0;box-shadow:inset 0 0 90px 18px rgba(60,25,5,.55)}
.top{position:absolute;top:24px;left:0;right:0;text-align:center;font-family:Cinzel,serif;font-weight:900;font-size:78px;color:#4a2610;letter-spacing:4px;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.top:before,.top:after{content:'';display:inline-block;width:70px;height:7px;background:#4a2610;vertical-align:middle;margin:0 22px 14px}
.big{position:absolute;top:96px;left:0;right:0;text-align:center;font-family:'Abril Fatface',serif;font-size:190px;line-height:1;color:#d0141d;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 7px 0 #5a0c08,0 12px 22px rgba(60,10,0,.55);letter-spacing:2px}
.rib{position:absolute;top:300px;left:50%;transform:translateX(-50%);background:#f3e2bf;border:3px solid #6b3a14;color:#4a2610;font-family:Cinzel,serif;font-weight:900;font-size:34px;padding:6px 44px 4px;box-shadow:0 4px 10px rgba(0,0,0,.35);white-space:nowrap}
.rib:before,.rib:after{content:'';position:absolute;top:8px;width:30px;height:100%;background:#d9c08f;border:3px solid #6b3a14;z-index:-1}
.rib:before{left:-26px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
.rib:after{right:-26px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.rib b{color:#d0141d}
</style></head><body>
<div class="img"></div><div class="parch"></div><div class="edge"></div>
<div class="top">TOP</div><div class="big">BIG</div><div class="rib">RIB</div>
</body></html>
