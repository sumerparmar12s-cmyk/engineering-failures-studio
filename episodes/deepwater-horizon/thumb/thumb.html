<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#06080b}
.bg{position:absolute;inset:0;background:url(rig.jpg) 62% 45%/auto 128% no-repeat;filter:saturate(1.2) contrast(1.1);-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 50%)}
.blur{position:absolute;left:0;top:0;width:700px;height:720px;background:url(rig.jpg) 20% 40%/auto 160%;filter:blur(22px) brightness(.28)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 170px rgba(0,0,0,.85)}
.top{position:absolute;left:40px;top:52px;font:900 46px 'Playfair Display',serif;color:#d8a25e;text-shadow:0 3px 10px #000}
.big{position:absolute;left:34px;top:110px;font:900 150px/0.98 'Playfair Display',serif;color:#e3251b;-webkit-text-stroke:3px #fff;text-shadow:0 6px 0 #5a0a05,0 12px 30px #000}
.rib{position:absolute;left:0;top:430px;background:#c8150c;color:#fff;font:700 36px 'Oswald',sans-serif;padding:10px 36px;letter-spacing:.06em;box-shadow:0 6px 18px rgba(0,0,0,.7);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%)}
.card{position:absolute;left:34px;top:530px;width:610px;background:#fbfaf6;padding:10px 12px 8px;transform:rotate(-2deg);box-shadow:0 14px 34px rgba(0,0,0,.8)}
.card img{width:100%;display:block}.card div{font:700 19px 'Oswald';letter-spacing:.08em;margin-top:5px;color:#111}
.gauge{position:absolute;right:46px;top:40px;background:rgba(0,0,0,.72);border:3px solid #ff8c28;color:#ff8c28;font:700 54px 'Oswald';padding:6px 22px;border-radius:6px}
</style></head><body>
<div class="blur"></div><div class="bg"></div><div class="vig"></div>
<div class="top">— 7 YEARS "SAFE" —</div>
<div class="big">THEN<br>THIS.</div>
<div class="rib">DEEPWATER HORIZON · 2010</div>
<div class="card"><img src="inset2.png"><div>NATIONAL COMMISSION REPORT · 2011</div></div>
<div class="gauge">1,400 PSI</div>
</body></html>
