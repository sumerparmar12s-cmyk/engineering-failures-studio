<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#03070b}
.bg{position:absolute;inset:0;background:url(bg.jpg) 92% 40%/auto 125% no-repeat;filter:saturate(1.15) contrast(1.12) brightness(1.05);-webkit-mask-image:linear-gradient(90deg,transparent 28%,#000 52%)}
.blur{position:absolute;left:0;top:0;width:720px;height:720px;background:url(bg.jpg) 30% 50%/auto 150%;filter:blur(24px) brightness(.25)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 170px rgba(0,0,0,.85)}
.top{position:absolute;left:40px;top:50px;font:900 44px 'Playfair Display',serif;color:#d8a25e;text-shadow:0 3px 10px #000}
.big{position:absolute;left:34px;top:108px;font:900 132px/0.98 'Playfair Display',serif;color:#e3251b;-webkit-text-stroke:3px #fff;text-shadow:0 6px 0 #5a0a05,0 12px 30px #000}
.rib{position:absolute;left:0;top:400px;background:#c8150c;color:#fff;font:700 36px 'Oswald',sans-serif;padding:10px 36px;letter-spacing:.06em;box-shadow:0 6px 18px rgba(0,0,0,.7);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%)}
.card{position:absolute;left:34px;top:500px;width:640px;background:#fbfaf6;padding:10px 12px 8px;transform:rotate(-2deg);box-shadow:0 14px 34px rgba(0,0,0,.8)}
.card img{width:100%;display:block}.card div{font:700 19px 'Oswald';letter-spacing:.08em;margin-top:5px;color:#111}
.gauge{position:absolute;right:46px;top:40px;background:rgba(0,0,0,.72);border:3px solid #5adcff;color:#5adcff;font:700 50px 'Oswald';padding:6px 22px;border-radius:6px}
</style></head><body>
<div class="blur"></div><div class="bg"></div><div class="vig"></div>
<div class="top">— WARNED IN WRITING —</div>
<div class="big">HE WENT<br>ANYWAY.</div>
<div class="rib">TITAN SUBMERSIBLE · 2023</div>
<div class="card"><img src="inset.png"><div>U.S. COAST GUARD INVESTIGATION REPORT · 2025</div></div>
<div class="gauge">3,346 m</div>
</body></html>
