name: Crypto Signals

on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"   # 7 min after every 4h candle closes (UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: SMC engine — backtest + paper trading (no real orders)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python crypto-signals/engine/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: crypto-signals/engine/report.html
